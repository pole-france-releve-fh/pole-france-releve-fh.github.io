<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex"><title>Indiscrétion depuis l'atelier du Père Noël</title>
<style>html,body{margin:0;height:100%;background:#0b1530;color:#fff;font-family:-apple-system,system-ui,sans-serif}
.w{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px;box-sizing:border-box;text-align:center}
h1{font-size:19px;margin:0}video{width:100%;max-width:420px;max-height:78vh;border-radius:16px;background:#000;box-shadow:0 8px 30px rgba(0,0,0,.5)}
a{color:#ffd54d;font-size:14px}</style></head>
<body><div class="w"><h1>🎅 Indiscrétion depuis l'atelier du Père Noël</h1>
<video src="video.mp4" poster="poster.jpg" controls autoplay muted playsinline loop></video>
<div style="font-size:13px;opacity:.8">Touchez la vidéo pour mettre le son 🔊</div>
<a href="../">Retour à l'appli</a></div>
<script>var v=document.querySelector('video');v.addEventListener('click',function(){if(v.muted){v.muted=false;v.currentTime=0;v.play();}});</script>
</body></html>
