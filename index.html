function tmin(h){if(h==null||h==='')return null;var m=String(h).match(/(\d{1,2})\s*[h:]\s*(\d{0,2})/);return m?Number(m[1])*60+(Number(m[2])||0):null;}

/* Proposition automatique : chaque tireur jusqu'à son nombre visé, 1 leçon par jour maximum, en respectant
   les dispos croisées, les maxima des maîtres d'armes et les préférences ; les créneaux se suivent pour limiter les trous. */
function plProposer(){
  var D=PL.data,co=plProf('Coach'),ti=plProf('Tireur'),props=[],all=D.lecons.slice();
  function cnt(f){return all.filter(f).length;}
  function busy(n,d,a,b){return all.some(function(l){if(l.date!==d||(l.coach!==n&&l.tireur!==n&&l.vs!==n))return false;var s=tmin(l.h),e=s+(+l.duree||30);return a<e&&s<b;});}
  function prefs(t){return [t.pref1,t.pref2].map(function(p){var m=norm(p).match(/^(LUNDI|MARDI|MERCREDI|JEUDI|VENDREDI|SAMEDI)/);var h=String(p||'').match(/(\d{1,2}h\d{0,2})/);return m?{j:['LUNDI','MARDI','MERCREDI','JEUDI','VENDREDI','SAMEDI'].indexOf(m[1]),t:h?tmin(h[1]):null}:null;}).filter(Boolean);}
  function collBusy(d,a,b){var J=(D.jours||[]).filter(function(j){return j.date===d;})[0];return !!J&&J.creneaux.some(function(c){if(/LECON/.test(norm(c.quoi)))return false;var s=tmin(c.h);return s!=null&&a<s+90&&s<b;});}
  var dispoTot=function(t){var s=0;for(var i=0;i<6;i++)plInt(t.nom,i).forEach(function(x){s+=x[1]-x[0];});return s;};
  var order=ti.filter(function(t){return t.cible>0;}).sort(function(x,y){return dispoTot(x)-dispoTot(y);});
  for(var round=0;round<6;round++){var placed=false;
    order.forEach(function(t){
      var have=cnt(function(l){return l.tireur===t.nom&&!l.vs&&!/entretien/i.test(l.note);});if(have>=t.cible||have>round)return;
      var best=null,pf=prefs(t),RG=D.regles||{},rk=((RG[norm(t.nom)]||{})[have+1])||[];
      for(var i=0;i<6;i++){var d=plDay(i);if(all.some(function(l){return l.date===d&&(l.tireur===t.nom||l.vs===t.nom);}))continue;
        plInt(t.nom,i).forEach(function(ti_){co.forEach(function(c){if(!plAllowed(c,t.nom))return;
          var nc=cnt(function(l){return l.coach===c.nom;}),nj=cnt(function(l){return l.coach===c.nom&&l.date===d;});if((c.max&&nc>=c.max)||(c.maxJour&&nj>=c.maxJour))return;
          plInt(c.nom,i).forEach(function(ci){var a=Math.max(ti_[0],ci[0]),b=Math.min(ti_[1],ci[1]);
            plSlots(i).filter(function(z){return z.s>=a&&z.e<=b;}).forEach(function(z){var s=z.s,dur=z.e-z.s;if(busy(c.nom,d,s,s+dur)||busy(t.nom,d,s,s+dur))return;
              var sc=0;pf.forEach(function(p){if(p.j===i){sc+=30;if(p.t!=null&&Math.abs(p.t-s)<=30)sc+=30;}});
              if(all.some(function(l){return l.date===d&&l.coach===c.nom&&(tmin(l.h)+(+l.duree||30)===s||s+dur===tmin(l.h));}))sc+=15;
              if(rk.length){var q=rk.indexOf(c.nom);sc+=q>=0?60-20*q:-40;}
              sc-=nc*0.8;sc-=(s-a)/60;if(!c.autorises)sc+=5;
              if(!best||sc>best.sc)best={sc:sc,date:d,h:tfmt(s),coach:c.nom,dur:dur};});
          });});});}
      if(best){var L={date:best.date,h:best.h,duree:best.dur,coach:best.coach,tireur:t.nom,vs:'',statut:'proposée'};all.push(L);props.push(L);placed=true;}
    });
    if(!placed)break;}
  if(!props.length){alert('Aucun créneau compatible trouvé avec les disponibilités actuelles.');return;}
  plSave(props,[]);
}

function cIso(d){return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);}

function cLun(d){var x=new Date(d.getFullYear(),d.getMonth(),d.getDate());return cAdd(x,-((x.getDay()+6)%7));}
function cCol(e){return CTYPE[String(e.type).trim()]||'#334155';}
function cShort(e){var n=String(e.nom).replace(/Coupe du Monde FIE/i,'CdM').replace(/Coupe Euro EFC/i,'CE').replace(/Tournoi Satellite FIE/i,'Satellite').replace(/Championnats? d'Europe/i,'Ch. Europe').replace(/Championnats? du Monde/i,'Ch. Monde').replace(/Championnats? de France/i,'Ch. France').replace(/EFC Eurofence League/i,'Eurofence').replace(/\s+/g,' ').trim();return n+(e.lieu?' · '+e.lieu:'');}
function cIdx(){return CAL.tir?CAL.data.heads.map(function(h){return h.nom;}).indexOf(CAL.tir):-1;}
function cPrio(e){var i=cIdx();return i<0?'':String(e.p[i]||'').toUpperCase();}
function cKeep(e){if(CAL.tir){return /^[ABCD]$/.test(cPrio(e));}return !(CAL.hide&&/pas de participation/i.test(e.type));}
function cNb(e){return e.p.filter(function(v){return /^[ABC]$/i.test(v);}).length;}
function cOn(iso){return CAL.data.ev.filter(function(e){return cKeep(e)&&e.d1<=iso&&e.d2>=iso;});}

function semBarreBind(s){
  function maj(sem){if(SEM.off===0){D.semaine=sem;cacheD(D);JOUR.c={};}else{SEM.data=null;}vSemaine();}
  function prec(){var d=new Date(s.lundi+'T12:00:00');d.setDate(d.getDate()-7);return d.toISOString().slice(0,10);}
  function go(b,src,q){if(!confirm(q))return;b.disabled=true;b.textContent='…';run('copierCreneaux',KEY,s.lundi,src).then(maj).catch(function(e){alert(e.message);b.disabled=false;});}
  if($('gType'))$('gType').onclick=function(){go(this,'type','Remplacer toutes les séances collectives de cette semaine par la semaine type ? (les leçons ne changent pas)');};

    $('modal').innerHTML='<div class="modal"><div class="card" style="max-width:1000px"><div class="row sp"><h3 style="margin:0">Semaine type</h3><button class="btn sm" id="stX">Fermer</button></div><div class="mut sm" style="margin:6px 0 10px">Pour la modifier : ajuste une semaine, puis « ★ En faire la semaine type ».</div><div class="days">'+daysHtml(fake,false,false)+'</div></div></div>';
    $('stX').onclick=function(){$('modal').innerHTML='';};});};

function parseDictee(t){

function ficheMuscu(f,ft){ft.innerHTML=loading('Chargement des charges…');run('getMuscu',KEY,f.nom).then(function(m){drawMuscu(m,f,ft);}).catch(function(e){ft.textContent=e.message;});}

  ordre.forEach(function(k){
    h+='<div class="card" style="margin-top:12px"><h3 style="margin-top:0">'+esc(k)+'</h3><table class="mut-t"><tr><th style="text-align:left">Mouvement</th><th>Meilleure perf</th><th>1RM estimé</th><th style="text-align:left">Dernières saisies</th></tr>';
    fam[k].forEach(function(n){var b=best[n],hs=(hist[n]||[]).slice(0,3);
      h+='<tr><td style="text-align:left"><a href="#" class="nm" data-mu="'+esc(n)+'">'+esc(n)+'</a></td><td>'+(b?'<b>'+b.charge+' kg</b> × '+b.reps+'<div class="mut sm">'+esc(frDate(b.date))+'</div>':'<span class="mut">–</span>')+'</td><td>'+(b?'<b>'+b.e1rm+' kg</b>':'')+'</td><td style="text-align:left" class="sm">'+hs.map(function(e){return esc(frDate(e.date))+' : '+e.charge+' kg × '+e.reps+(e.comm?' <span class="mut">('+esc(e.comm)+')</span>':'')+' <a href="#" class="mut" title="Supprimer" data-mudel="'+e.ligne+'|'+esc(e.mvt)+'|'+e.date+'">✕</a>';}).join('<br>')+'</td></tr>';});
    h+='</table></div>';
  });
  ft.innerHTML=h;
  [].forEach.call(ft.querySelectorAll('[data-mu]'),function(a){a.onclick=function(e){e.preventDefault();$('muM').value=a.dataset.mu;$('muC').focus();ft.scrollIntoView({behavior:'smooth'});};});
  [].forEach.call(ft.querySelectorAll('[data-mudel]'),function(a){a.onclick=function(e){e.preventDefault();var p=a.dataset.mudel.split('|');if(!confirm('Supprimer cette saisie ?'))return;run('supprimerCharge',KEY,Number(p[0]),p[1],p[2]).then(function(){ficheMuscu(f,ft);}).catch(function(x){alert(x.message);});};});
  $('muOk').onclick=function(){var c=$('muC').value.trim(),r=$('muR').value.trim();if(!c||!r){$('muMsg').className='msg err';$('muMsg').textContent='Indique la charge et le nombre de répétitions.';return;}
    $('muMsg').className='msg';$('muMsg').textContent='Enregistrement…';
    run('saveCharge',KEY,{tireur:f.nom,mvt:$('muM').value,charge:c,reps:r,date:$('muD').value,comm:$('muX').value}).then(function(){ficheMuscu(f,ft);}).catch(function(x){$('muMsg').className='msg err';$('muMsg').textContent=x.message;});};

function resVues(d){

    else if(/^RESULTATS_/.test(type))nom='Saison '+(p[2]||'').replace(/20(\d\d)\/20(\d\d)/,'$1/$2');
    if(nom){v[nom]=v[nom]||[];[].push.apply(v[nom],g.cols);}

  cats.forEach(function(ct){var sais='';d.groupes.forEach(function(g){var p=String(g.code).split('|');if(p[0]==='CLASSEMENT'&&p[1]===ct&&p[2]>sais)sais=p[2];});
    if(sais)d.groupes.forEach(function(g){var p=String(g.code).split('|');if(p[0]==='CLASSEMENT'&&p[1]===ct&&p[2]===sais)g.cols.forEach(function(c){if(plus.indexOf(c)<0)plus.push(c);});});});

}

}

var PARC={},TIPT=null;
function hdrDate(h){var m=String(h||'').match(/(\d{1,2})[-\/](\d{1,2})[-\/](\d{2,4})/);if(!m)return '';var y=m[3].length===2?'20'+m[3]:m[3];return ('0'+m[1]).slice(-2)+'/'+('0'+m[2]).slice(-2)+'/'+y;}
function tipHide(ms){clearTimeout(TIPT);TIPT=setTimeout(function(){var t=$('tip');if(t)t.style.display='none';},ms||0);}
function tipSet(t,h){t.innerHTML='<button class="tipx" aria-label="Fermer">×</button>'+h;t.querySelector('.tipx').onclick=function(ev){ev.stopPropagation();tipHide(0);};}
function showTip(td,e){
  clearTimeout(TIPT);
  var nom=td.parentNode.dataset.n,dt=td.dataset.d,head=norm(td.dataset.h),t=$('tip');
  if(!t){t=document.createElement('div');t.id='tip';t.className='tip';document.body.appendChild(t);t.onmouseenter=function(){clearTimeout(TIPT);};t.onmouseleave=function(){tipHide(200);};document.addEventListener('click',function(ev){if(!t.contains(ev.target))tipHide(0);});}
  t.style.display='block';t.style.left=Math.max(8,Math.min(e.clientX+4,innerWidth-396))+'px';t.style.top=Math.max(8,e.clientY+4)+'px';
  function fit(){var hh=t.offsetHeight;if(e.clientY+4+hh>innerHeight-8)t.style.top=Math.max(8,innerHeight-8-hh)+'px';}
  t.dataset.cur=nom+dt;
  function draw(list){if(t.dataset.cur!==nom+dt)return;var c=list.filter(function(p){return p.date===dt;});
    if(c.length>1){var f=c.filter(function(p){var k=(String(p.ep).match(/M17|M20|M23|SENIOR/i)||[''])[0].toUpperCase();return k&&head.indexOf(k)>=0;});if(f.length)c=f;}
    tipSet(t,'<div class="b" style="margin-bottom:4px;padding-right:26px">'+esc(nom)+'</div>'+(c.length?parcoursHtml([c[0]],true):'<div class="mut">Pas de parcours détaillé importé pour cette épreuve.</div>'));t.scrollTop=0;fit();}
  if(PARC[nom])draw(PARC[nom]);
  else{tipSet(t,'<span class="spin"></span>Parcours de '+esc(nom)+'…');run('getParcoursTireur',KEY,nom).then(function(l){PARC[nom]=l;draw(l);}).catch(function(er){t.textContent=er.message;});}

function vWellness(){
  var pole=D.tireurs.filter(function(t){return t.pole;}),jours=[];
  for(var i=6;i>=0;i--){var d=new Date(Date.now()-i*864e5);jours.push(d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2));}
  var map={};D.wellness.forEach(function(w){map[norm(w.tireur)+'|'+w.d]=w;});
  function col(v){return v==null?'background:#f0f2f5;color:#9aa1ad':v<=13?'background:var(--bad-bg);color:var(--bad)':v<=17?'background:var(--warn-bg);color:var(--warn)':'background:var(--ok-bg);color:var(--ok)';}
  var h='<div class="card"><h3>Score wellness sur 7 jours (sur 25)</h3><div class="wg" style="grid-template-columns:minmax(80px,170px) repeat(7,minmax(0,1fr))"><span></span>'+jours.map(function(j){return '<span class="mut">'+frDate(j)+'</span>';}).join('');
  pole.forEach(function(t){h+='<span style="text-align:left">'+esc(t.prenom)+' '+esc(t.nom)+'</span>'+jours.map(function(j){var w=map[t.cle+'|'+j];return '<span style="'+col(w?w.total:null)+'" title="'+(w?'sommeil '+w.s+', forme '+w.f+', courbatures '+w.c+', humeur '+w.hu+', stress '+w.st+(w.comm?' · '+esc(w.comm):''):'')+'">'+(w?w.total:'–')+'</span>';}).join('');});
  h+='</div><div class="mut sm" style="margin-top:8px">Vert : 18 et plus · orange : 14 à 17 · rouge : 13 et moins.</div></div>';
  var comm=D.wellness.filter(function(w){return w.comm;}).slice(-10).reverse();
  h+='<div class="card" style="margin-top:12px"><h3>Derniers commentaires</h3>'+(comm.length?'<table>'+comm.map(function(w){return '<tr><td>'+frDate(w.d)+'</td><td>'+esc(w.tireur)+'</td><td>'+esc(w.comm)+'</td></tr>';}).join('')+'</table>':'<div class="empty">Aucun commentaire.</div>')+'</div>';

}

function wellnessForm(n){

function wCheck(f){if(f.tireur===''&&!(D.user.role==='Tireur'))return 'Choisis le tireur';var k=['s','f','c','hu','st'];for(var i=0;i<k.length;i++)if(!f[k[i]])return 'Réponds aux cinq questions';}

function bind(id,check,fn){
  var form=$(id);if(!form)return;
  form.onsubmit=function(e){e.preventDefault();var f={};new FormData(form).forEach(function(v,k){f[k]=v;});if(form.paye)f.paye=form.paye.checked;
    var m=form.querySelector('.msg'),err=check(f);if(err){m.className='msg err';m.textContent=err;return;}
    m.className='msg';m.textContent='Enregistrement…';
    run(fn,KEY,f).then(function(){m.className='msg okm';m.textContent='Enregistré.';form.reset();[].forEach.call(form.querySelectorAll('.scale button'),function(b){b.classList.remove('on');});}).catch(function(er){m.className='msg err';m.textContent=er.message;});};
}
