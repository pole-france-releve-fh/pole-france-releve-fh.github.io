/* Proposition automatique : chaque tireur jusqu'à son nombre visé, 1 leçon par jour maximum, en respectant
   les dispos croisées, les maxima des maîtres d'armes et les préférences ; les créneaux se suivent pour limiter les trous. */
function plProposer(){
  var D=PL.data,co=plProf('Coach'),ti=plProf('Tireur'),props=[],all=D.lecons.slice();
  function cnt(f){return all.filter(f).length;}
  function busy(n,d,a,b){return all.some(function(l){if(l.date!==d||(l.coach!==n&&l.tireur!==n&&l.vs!==n))return false;var s=tmin(l.h),e=s+(+l.duree||30);return a<e&&s<b;});}
  function prefs(t){return [t.pref1,t.pref2].map(function(p){var m=norm(p).match(/^(LUNDI|MARDI|MERCREDI|JEUDI|VENDREDI|SAMEDI)/);var h=String(p||'').match(/(\d{1,2}h\d{0,2})/);return m?{j:['LUNDI','MARDI','MERCREDI','JEUDI','VENDREDI','SAMEDI'].indexOf(m[1]),t:h?tmin(h[1]):null}:null;}).filter(Boolean);}
  function collBusy(d,a,b){var J=(D.jours||[]).filter(function(j){return j.date===d;})[0];return !!J&&J.creneaux.some(function(c){if(/LECON/.test(norm(c.quoi)))return false;var s=tmin(c.h);return s!=null&&a<s+90&&s<b;});}
  var dispoTot=function(t){var s=0;for(var i=0;i<6;i++)plInt(t.nom,i).forEach(function(x){s+=x[1]-x[0];});return s;};
  var order=ti.filter(function(t){return t.cible>0;}).sort(function(x,y){return dispoTot(x)-dispoTot(y);});
  for(var round=0;round<6;round++){var placed=false;
    order.forEach(function(t){
      var have=cnt(function(l){return l.tireur===t.nom&&!l.vs;});if(have>=t.cible||have>round)return;
      var best=null,pf=prefs(t);
      for(var i=0;i<6;i++){var d=plDay(i);if(all.some(function(l){return l.date===d&&(l.tireur===t.nom||l.vs===t.nom);}))continue;
        plInt(t.nom,i).forEach(function(ti_){co.forEach(function(c){if(!plAllowed(c,t.nom))return;
          var nc=cnt(function(l){return l.coach===c.nom;}),nj=cnt(function(l){return l.coach===c.nom&&l.date===d;});if((c.max&&nc>=c.max)||(c.maxJour&&nj>=c.maxJour))return;
          plInt(c.nom,i).forEach(function(ci){var a=Math.max(ti_[0],ci[0]),b=Math.min(ti_[1],ci[1]);
            plSlots(i).filter(function(z){return z.s>=a&&z.e<=b;}).forEach(function(z){var s=z.s,dur=z.e-z.s;if(busy(c.nom,d,s,s+dur)||busy(t.nom,d,s,s+dur))return;
              var sc=0;pf.forEach(function(p){if(p.j===i){sc+=30;if(p.t!=null&&Math.abs(p.t-s)<=30)sc+=30;}});
              if(all.some(function(l){return l.date===d&&l.coach===c.nom&&(tmin(l.h)+(+l.duree||30)===s||s+dur===tmin(l.h));}))sc+=15;
              sc-=nc*0.8;sc-=(s-a)/60;if(!c.autorises)sc+=5;
              if(!best||sc>best.sc)best={sc:sc,date:d,h:tfmt(s),coach:c.nom,dur:dur};});
          });});});}
      if(best){var L={date:best.date,h:best.h,duree:best.dur,coach:best.coach,tireur:t.nom,vs:'',statut:'proposée'};all.push(L);props.push(L);placed=true;}
    });
    if(!placed)break;}
  if(!props.length){alert('Aucun créneau compatible trouvé avec les disponibilités actuelles.');return;}
  plSave(props,[]);
}

var CAL={mode:'mois',d:new Date(),tir:'',hide:true,data:null};

var MOIS=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'],JS=['lun','mar','mer','jeu','ven','sam','dim'];
function cIso(d){return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);}
function cDate(s){var p=String(s).split('-');return new Date(+p[0],+p[1]-1,+p[2]);}
function cAdd(d,n){var x=new Date(d);x.setDate(x.getDate()+n);return x;}
function cLun(d){var x=new Date(d.getFullYear(),d.getMonth(),d.getDate());return cAdd(x,-((x.getDay()+6)%7));}
function cCol(e){return CTYPE[String(e.type).trim()]||'#334155';}
function cShort(e){var n=String(e.nom).replace(/Coupe du Monde FIE/i,'CdM').replace(/Coupe Euro EFC/i,'CE').replace(/Tournoi Satellite FIE/i,'Satellite').replace(/Championnats? d'Europe/i,'Ch. Europe').replace(/Championnats? du Monde/i,'Ch. Monde').replace(/Championnats? de France/i,'Ch. France').replace(/EFC Eurofence League/i,'Eurofence').replace(/\s+/g,' ').trim();return n+(e.lieu?' · '+e.lieu:'');}
function cIdx(){return CAL.tir?CAL.data.heads.map(function(h){return h.nom;}).indexOf(CAL.tir):-1;}
function cPrio(e){var i=cIdx();return i<0?'':String(e.p[i]||'').toUpperCase();}
function cKeep(e){if(CAL.tir){return /^[ABCD]$/.test(cPrio(e));}return !(CAL.hide&&/pas de participation/i.test(e.type));}
function cNb(e){return e.p.filter(function(v){return /^[ABC]$/i.test(v);}).length;}
function cOn(iso){return CAL.data.ev.filter(function(e){return cKeep(e)&&e.d1<=iso&&e.d2>=iso;});}
function cTrav(iso){return CAL.data.ev.filter(function(e){return cKeep(e)&&e.dep&&e.ret&&e.dep<=iso&&e.ret>=iso&&!(e.d1<=iso&&e.d2>=iso);});}
function cPill(e,tr){var i=CAL.data.ev.indexOf(e),p=cPrio(e);return '<span class="ev'+(tr?' tr':'')+'" style="--ec:'+cCol(e)+'" data-e="'+i+'" title="'+esc(e.nom+' · '+e.lieu+' · '+e.cat+' · '+e.type)+'">'+(p&&!tr?'<span class="pl">'+p+'</span>':'')+(tr?'✈ ':'')+esc(cShort(e))+'</span>';}
var ETYPE={'Stage':'#0e7490','Regroupement':'#be185d','Autre':'#475569'},ETYPES=['Stage','Regroupement','Vacances scolaires','Férié','Autre'];
function cEv(iso){return (CAL.data.evts||[]).filter(function(e){return !/vacances|f.ri/i.test(e.type)&&e.d1<=iso&&e.d2>=iso;});}
function cVac(iso){return (CAL.data.evts||[]).filter(function(e){return /vacances/i.test(e.type)&&e.d1<=iso&&e.d2>=iso;})[0];}
function cFer(iso){return (CAL.data.evts||[]).filter(function(e){return /f.ri/i.test(e.type)&&e.d1<=iso&&e.d2>=iso;})[0];}
function eCol(e){return ETYPE[e.type]||'#475569';}
function ePill(e){return '<span class="ev st" style="--ec:'+eCol(e)+'" data-v="'+CAL.data.evts.indexOf(e)+'" title="'+esc(e.type+' · '+e.titre+(e.lieu?' · '+e.lieu:'')+(e.qui?' · '+e.qui:''))+'">◆ '+esc(e.titre)+'</span>';}
function cFr(iso,y){var d=cDate(iso);return d.getDate()+' '+MOIS[d.getMonth()]+(y?' '+d.getFullYear():'');}
function cDates(e){return e.d1===e.d2?cFr(e.d1,true):cFr(e.d1)+' → '+cFr(e.d2,true);}

function vCalendrier(){

  h+=({planning:cPlanning,annee:cYear,mois:cMonth,semaine:cWeek,jour:cDay})[CAL.mode]()+'</div>';

  $('cadd').onclick=function(){competForm(null);};
  $('eadd').onclick=function(){evtForm(null);};

  };

function cGrid(y,m,big){
  var f=new Date(y,m,1),s=cLun(f),td=today(),h='';
  if(big)h+=JS.map(function(j){return '<div class="dw">'+j+'</div>';}).join('');else h+=JS.map(function(j){return '<i>'+j[0]+'</i>';}).join('');
  for(var i=0;i<42;i++){var d=cAdd(s,i),iso=cIso(d),o=d.getMonth()!==m;
    if(!big){if(i>=35&&o)break;if(o){h+='<span></span>';continue;}var E=cOn(iso),S=cEv(iso),V=cVac(iso),F=cFer(iso),col=E.length?cCol(E[0]):S.length?eCol(S[0]):'';h+='<span class="'+(col?'e':'')+(V&&!col?' vac':'')+(iso===td?' t':'')+'" style="--ec:'+col+'" data-d="'+iso+'" title="'+esc(E.map(function(e){return cShort(e);}).concat(S.map(function(e){return e.titre;})).concat(V?[V.titre]:[]).concat(F?[F.titre]:[]).join('\n'))+'">'+d.getDate()+'</span>';continue;}
    if(i>=35&&o)break;
    var E2=cOn(iso),T=cTrav(iso),V=cVac(iso),F=cFer(iso),S=cEv(iso);
    h+='<div class="cd'+(o?' o':'')+(iso===td?' t':'')+(d.getDay()%6===0?' we':'')+(V?' vac':'')+'"><span class="n" data-d="'+iso+'">'+d.getDate()+'</span>'+(F?'<span class="fer">'+esc(F.titre)+'</span>':'')+(V&&(iso===V.d1||d.getDay()===1)?'<span class="vl" data-v="'+CAL.data.evts.indexOf(V)+'">'+esc(V.titre)+'</span>':'')+S.map(ePill).join('')+E2.map(function(e){return cPill(e);}).join('')+T.map(function(e){return cPill(e,1);}).join('')+'</div>';}

/* Jours du programme de Mathieu : J1 mardi matin, J3 jeudi soir, J4 vendredi, salle d'escrime lundi ou mardi après-midi */

function ppBloc(dateIso,h){var d=new Date(dateIso+'T12:00:00').getDay(),am=hnum(h)<13*60;if(d===1)return /salle/i;if(d===2)return am?/jour 1/i:/salle/i;if(d===4)return /jour 3/i;if(d===5)return /jour 4/i;return null;}

function typeDe(q){q=norm(q);if(q.indexOf('PREPA')>=0)return 'Prépa physique';if(q.indexOf('LECON')>=0)return 'Leçons';if(q.indexOf('FONDA')>=0)return (q.indexOf('ASSAUT')>=0||/\bASSO/.test(q))?'Fondamentaux + assauts':'Fondamentaux';if(q.indexOf('DOUBLETTE')>=0)return 'Assauts en doublette';if(q.indexOf('ASSAUT')>=0||/\bASSO/.test(q))return 'Assauts';if(q.indexOf('RECUP')>=0)return 'Récup';return q?q.charAt(0)+q.slice(1).toLowerCase():'Autre';}

function taillesPoules(n,k){var b=Math.floor(n/k),r=n%k,t=[];if(r)t.push(r+' poule'+(r>1?'s':'')+' de '+(b+1));if(k-r)t.push((k-r)+' poule'+(k-r>1?'s':'')+' de '+b);return t.join(' et ');}
/* Remplace l'exercice i par k poules, présents répartis en serpentin ; volume en 5 touches calculé pour chaque poule. */
function repartirPoules(i,k){var c=CUR,e=c.exercices[i],p=presents();k=Math.max(1,Math.min(Number(k)||1,p.length||1));

function parseDictee(t){

  bind('fS',function(f){if(!f.tireur)return 'Choisis un tireur';if(!f.matiere)return 'Indique la matière';},'saveScolaire');
}
function wellnessForm(n){
  var q=[['s','Sommeil','1 = très mal dormi, 5 = très bien'],['f','Forme','1 = épuisé, 5 = en pleine forme'],['c','Courbatures','1 = très fortes, 5 = aucune'],['hu','Humeur','1 = très basse, 5 = très bonne'],['st','Stress','1 = très stressé, 5 = détendu']];
  return '<form id="fW">'+(n?'<label>Tireur</label><select name="tireur">'+opts(n,'Choisir')+'</select>':'')+q.map(function(x){return '<label>'+x[1]+' <span style="font-weight:400">('+x[2]+')</span></label><div class="scale" data-k="'+x[0]+'">'+[1,2,3,4,5].map(function(k){return '<button type="button" data-n="'+k+'">'+k+'</button>';}).join('')+'</div><input type="hidden" name="'+x[0]+'">';}).join('')+'<label>Commentaire (facultatif)</label><textarea name="comm" rows="2"></textarea><button class="go">Envoyer</button><div class="msg"></div></form>';
}
function wCheck(f){if(f.tireur===''&&!(D.user.role==='Tireur'))return 'Choisis le tireur';var k=['s','f','c','hu','st'];for(var i=0;i<k.length;i++)if(!f[k[i]])return 'Réponds aux cinq questions';}
function bindScale(){[].forEach.call(document.querySelectorAll('.scale'),function(sc){sc.onclick=function(e){var n=e.target.dataset.n;if(!n)return;[].forEach.call(sc.children,function(b){b.classList.toggle('on',b.dataset.n===n);});sc.nextElementSibling.value=n;};});}
function bind(id,check,fn){
  var form=$(id);if(!form)return;
  form.onsubmit=function(e){e.preventDefault();var f={};new FormData(form).forEach(function(v,k){f[k]=v;});if(form.paye)f.paye=form.paye.checked;
    var m=form.querySelector('.msg'),err=check(f);if(err){m.className='msg err';m.textContent=err;return;}
    m.className='msg';m.textContent='Enregistrement…';
    run(fn,KEY,f).then(function(){m.className='msg okm';m.textContent='Enregistré.';form.reset();[].forEach.call(form.querySelectorAll('.scale button'),function(b){b.classList.remove('on');});}).catch(function(er){m.className='msg err';m.textContent=er.message;});};
}

/* ---------------- VUES TIREUR ---------------- */
function vMoi(){renderFiche(D.fiche,false);}
function vWellnessT(){$('app').innerHTML='<div class="card" style="max-width:520px;margin:0 auto"><h3>Wellness du jour</h3><div class="mut sm">30 secondes. Tes réponses ne sont vues que par le staff du pôle.</div>'+wellnessForm(null)+'</div>';bindScale();bind('fW',wCheck,'saveWellness');}

load();
